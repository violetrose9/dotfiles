# Use zsh as the default shell
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh

set-option -g prefix C-b

# colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
# status bar
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-right " %I:%M %p %d-%b " # right side with time(AM:PM) and date only
set -g status-left "[#S]"
# active window
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[fg=#e0def4,bg=#6e6a86,bold] #I:#W #[default]'

# mouse
set -g mouse on

set -s escape-time 0

# unbindings
unbind C-l

# Kill current window without confirmation
bind-key q kill-window
# kill current pane without confirmation
bind-key x kill-pane

# fuzzy find sessions
bind-key f display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"


# Switch windows with Alt + number
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# vim mode yay
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Use vim-style copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Reload config with Prefix + r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# plugins
set -g @plugin 'christoomey/vim-tmux-navigator'

# Split panes
bind v split-window -h
bind h split-window -v

# Initialize TPM -- MUST be the last line
run '~/.tmux/plugins/tpm/tpm'
