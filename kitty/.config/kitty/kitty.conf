shell /usr/bin/zsh
shell_integration enabled
# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# include black_metal_theme.conf
# END_KITTY_THEME

background #000000

# window
remember_window_size no

# sound
enable_audio_bell no

# cursor
cursor #cdd6f4
cursor_trail 1
cursor_trail_decay 0.01 0.05
cursor_trail_start_threshold 5
custom_shaders cursor-trail-motion-blur
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 1
notify_on_cmd_finish unfocused 2.0 notify-bell

# mappings
map f11 toggle_fullscreen

# Font Configuration
font_size 18.0

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_align left
